plugins { id 'net.minecraftforge.gradle' version '[5.1,5.2)' }
def mc = providers.gradleProperty('mc_version').get()
def forge = providers.gradleProperty('forge_version').get()
def jei = providers.gradleProperty('jei_version').get()
def source = providers.gradleProperty('search_source').get()
def fml = forge.tokenize('.')[0]
def targetJava = Integer.parseInt(providers.gradleProperty('java_target').orElse('8').get())
def mappingsChannel = providers.gradleProperty('mappings_channel').orElse('official').get()
def mappingsVersion = providers.gradleProperty('mappings_version').orElse(mc).get()
group = 'io.github.romaintv20.jeitranslationexpansion'
version = '1.0.1-rc.1'
archivesBaseName = 'jei-translation-expansion-1.0.1-rc.1-mc' + mc + '-forge'
java {
    sourceCompatibility = JavaVersion.toVersion(targetJava)
    targetCompatibility = JavaVersion.toVersion(targetJava)
}
minecraft { mappings channel: mappingsChannel, version: mappingsVersion }
repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
dependencies { minecraft ('net.minecraftforge:forge:' + mc + '-' + forge) }
def staged = file('../../../translations/staged-published-2026-10-11/' + mc)
def hasStaged = file(staged.path + '/semantic-diff.json').isFile()
def searchRoot = file('../../../features/language-search/' + source)
if (!searchRoot.isDirectory()) throw new GradleException('Search source missing: ' + source)
sourceSets {
    main {
        java.srcDirs = ['src/main/java', '../../../features/language-search/common', searchRoot.path]
        resources.srcDirs = ['src/main/resources']
        if (hasStaged) resources.srcDirs += [staged.path + '/full', staged.path + '/supplements']
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.named('processResources') {
    inputs.properties([
        'forge_version': forge, 'minecraft_version':mc, 'jei_version':jei, 'fml_version':fml
    ])
    if (!hasStaged) {
        def candidate = file('../../../candidate-jars/' + mc + '/jei-translation-expansion-1.0.0-mc' + mc + '-forge.jar')
        if (!candidate.isFile()) throw new GradleException('Historical JAR not found: ' + mc)
        from(zipTree(candidate)) { include 'assets/jei/lang/**' }
    }
    filesMatching('META-INF/mods.toml') {
        expand(forge_version:forge, minecraft_version:mc, jei_version:jei, fml_version:fml)
    }
}
reobf { jar {} }
tasks.named('jar') {
    archiveFileName = 'jei-translation-expansion-1.0.1-rc.1-mc' + mc + '-forge.jar'
    manifest.attributes('Implementation-Title':'JEI Translation Expansion',
            'Implementation-Version':'1.0.1-rc.1','Minecraft-Version':mc,'JEI-Version':jei)
    finalizedBy 'reobfJar'
}

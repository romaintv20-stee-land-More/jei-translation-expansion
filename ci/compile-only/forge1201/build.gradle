// This fixture verifies Java against REAL Forge 1.20.1 client classes.
// NEVER execute jar, build, reobfJar or publish tasks.
plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

sourceSets {
    main {
        java {
            srcDirs = [
                '../../../features/language-search/common',
                '../../../features/language-search/forge_1_20_1',
            ]
        }
        resources.srcDirs = []
    }
}

tasks.named('jar') {
    enabled = false
}

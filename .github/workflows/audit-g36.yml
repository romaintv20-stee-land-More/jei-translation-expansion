name: Audit G36 Minecraft 1.20.4

on:
  workflow_dispatch:
  push:
    branches: ['work/g36-mc1.20.4']
    paths:
      - 'scripts/audit_1_20_4.py'
      - '.github/workflows/audit-g36.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.20.4 / JEI 17.3.0 endpoint
        run: python scripts/audit_1_20_4.py

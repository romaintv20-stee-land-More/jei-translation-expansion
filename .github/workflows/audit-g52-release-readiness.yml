name: Audit G52 Minecraft 26.3 release readiness

on:
  workflow_dispatch:
  push:
    branches: ['work/g52-mc26.3-release-readiness']
    paths:
      - 'scripts/audit_26_3_release_readiness.py'
      - '.github/workflows/audit-g52-release-readiness.yml'
      - 'upstream/minecraft-26.2-language-scope.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit final Minecraft 26.3 and current JEI readiness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_26_3_release_readiness.py

      - name: Validate readiness report gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('upstream/provisional/minecraft-26.3-release-readiness.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['minecraft']['version'] == '26.3'
          assert data['minecraft']['manifest_type'] == 'release'
          assert data['minecraft']['selected_scope_count'] == 90
          assert data['minecraft']['selected_scope_still_present'] is True
          assert data['not_a_completed_generation'] is True
          assert data['g52_registration_allowed'] is False
          assert data['decision']['complete_g52_now'] is False
          print(data['status'])
          print(data['decision']['reason'])
          PY

      - name: Persist readiness report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream/provisional/minecraft-26.3-release-readiness.json
          if git diff --cached --quiet; then
            echo 'Minecraft 26.3 readiness report already matches.'
            exit 0
          fi
          git commit -m 'Record stable Minecraft 26.3 G52 readiness'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

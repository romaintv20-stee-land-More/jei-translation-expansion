name: Validate G33 Minecraft 1.20

on:
  workflow_dispatch:
  push:
    branches: ['work/g33-mc1.20']
    paths:
      - 'scripts/audit_1_20.py'
      - 'scripts/reconstruct_1_20.py'
      - 'scripts/validate_1_20_delta.py'
      - 'scripts/validate_1_20_complete.py'
      - 'upstream/sources/1.20/en_us.json'
      - 'upstream/diffs/1.19.4-to-1.20.json'
      - 'upstream/minecraft-1.20-language-scope.json'
      - 'upstream/minecraft-1.20-language-audit.json'
      - 'translations/g33-mc1.20/policy.json'
      - '.github/workflows/audit-g33.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.20 / JEI 14.0.0 endpoint
        run: python scripts/audit_1_20.py
      - name: Validate Minecraft 1.20 source scope and upstream ownership
        run: python scripts/validate_1_20_delta.py
      - name: Reconstruct and verify Minecraft 1.20 resources
        run: python scripts/reconstruct_1_20.py --check
      - name: Validate Minecraft 1.20 complete resources
        run: python scripts/validate_1_20_complete.py

name: Audit G33 Minecraft 1.20

on:
  workflow_dispatch:
  push:
    branches: ['work/g33-mc1.20']
    paths:
      - 'scripts/audit_1_20.py'
      - '.github/workflows/audit-g33.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.20 / JEI 14.0.0 endpoint
        run: python scripts/audit_1_20.py

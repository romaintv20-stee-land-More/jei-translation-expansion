name: Validate G18 endpoint

on:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.15.2 / JEI 6.0.2 endpoint
        run: python scripts/audit_1_15_2.py
      - name: Validate Minecraft 1.15.2 source scope and upstream ownership
        run: python scripts/validate_1_15_2_delta.py
      - name: Reconstruct and verify Minecraft 1.15.2 resources
        run: python scripts/reconstruct_1_15_2.py --check
      - name: Validate Minecraft 1.15.2 complete resources
        run: python scripts/validate_1_15_2_complete.py

name: Scan maintained JEI localization branches

on:
  workflow_dispatch:
  push:
    branches: ['maintenance/jei-update-scan']
    paths:
      - 'scripts/audit_maintained_jei_branches.py'
      - '.github/workflows/scan-maintained-jei.yml'
      - 'packaging/completed-versions.json'
      - 'upstream/sources/**/en_us.json'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan maintained JEI branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_maintained_jei_branches.py | tee maintained-jei-scan.txt
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: maintained-jei-branch-scan
          path: |
            build/maintained-jei-branch-scan.json
            maintained-jei-scan.txt
          if-no-files-found: error
          retention-days: 14

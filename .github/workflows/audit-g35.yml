name: Audit G35 Minecraft 1.20.2

on:
  workflow_dispatch:
  push:
    branches: ['work/g35-mc1.20.2']
    paths:
      - 'scripts/audit_1_20_2.py'
      - '.github/workflows/audit-g35.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.20.2 / JEI 16.0.0 endpoint
        run: python scripts/audit_1_20_2.py

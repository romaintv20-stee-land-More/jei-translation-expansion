name: Audit G26 endpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-g26.yml'
      - 'scripts/audit_1_18_1.py'
      - 'upstream/sources/1.18.1/en_us.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.18.1 / JEI 9.4.1 endpoint
        run: python scripts/audit_1_18_1.py

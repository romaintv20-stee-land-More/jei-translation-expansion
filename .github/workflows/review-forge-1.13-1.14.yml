name: Review Forge Minecraft 1.13.2 to 1.14.3 search integration

on:
  push:
    branches: [feature/complete-all-52-jars-2026-10-18]
    paths: ['.github/workflows/review-forge-1.13-1.14.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mc: '1.13.2', forge: '25.0.223', jei: '5.0.0', source: 'drafts/mc1_13_2'}
          - {mc: '1.14.2', forge: '26.0.63', jei: '6.0.0', source: 'drafts/mc1_14_2'}
          - {mc: '1.14.3', forge: '27.0.60', jei: '6.0.0', source: 'drafts/mc1_14_3'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Compile authentic early Forge language selector GUI
        run: >
          gradle --no-daemon --console=plain -p ci/review/forge-1.16 build
          -Pmc_version=${{ matrix.mc }}
          -Pforge_version=${{ matrix.forge }}
          -Pjei_version=${{ matrix.jei }}
          -Psearch_source=${{ matrix.source }}
          -Pjava_target=8
      - name: Verify jar and locale files
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find ci/review/forge-1.16/build/libs -name '*.jar' | head -n1)
          test -s "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep 'LanguageSearch.*class'
          unzip -l "$JAR" | grep 'assets/jei/lang/'
      - uses: actions/upload-artifact@v4
        with:
          name: forge-mc-${{ matrix.mc }}-search-candidate-not-game-tested
          path: ci/review/forge-1.16/build/libs/*.jar
          retention-days: 30
          if-no-files-found: error

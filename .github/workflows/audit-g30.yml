name: Validate G30 Minecraft 1.19.2

on:
  workflow_dispatch:
  push:
    branches: ['work/g30-mc1.19.2']
    paths:
      - 'upstream/sources/1.19.2/**'
      - 'upstream/diffs/1.19.1-to-1.19.2.json'
      - 'upstream/minecraft-1.19.2-language-audit.json'
      - 'upstream/minecraft-1.19.2-language-scope.json'
      - 'translations/g30-mc1.19.2/**'
      - 'scripts/audit_1_19_2.py'
      - 'scripts/reconstruct_1_19_2.py'
      - 'scripts/validate_1_19_2_delta.py'
      - 'scripts/validate_1_19_2_complete.py'
      - '.github/workflows/audit-g30.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.19.2 / JEI 11.5.0 endpoint
        run: python scripts/audit_1_19_2.py
      - name: Validate Minecraft 1.19.2 source scope and upstream ownership
        run: python scripts/validate_1_19_2_delta.py
      - name: Reconstruct and verify Minecraft 1.19.2 resources
        run: python scripts/reconstruct_1_19_2.py --check
      - name: Validate Minecraft 1.19.2 complete resources
        run: python scripts/validate_1_19_2_complete.py

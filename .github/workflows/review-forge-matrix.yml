name: Build Forge 1.19.4 to 1.21 with real language search (REVIEW ONLY)

on:
  push:
    branches:
      - feature/complete-all-52-jars-2026-10-18
    paths:
      - '.github/workflows/review-forge-matrix.yml'
      - 'ci/review/forge-matrix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.19.4', forge: '45.4.0', java: '17', source: '1_19_4', jei: '13.1.0.19' }
          - { mc: '1.20', forge: '46.0.14', java: '17', source: '1_20', jei: '14.0.0' }
          - { mc: '1.20.2', forge: '48.1.0', java: '17', source: '1_20_2', jei: '16.0.0' }
          - { mc: '1.20.4', forge: '49.1.0', java: '17', source: '1_20_4', jei: '17.3.1.5' }
          - { mc: '1.20.6', forge: '50.1.0', java: '21', source: '1_20_6', jei: '18.0.0.66' }
          - { mc: '1.21', forge: '51.0.8', java: '21', source: '1_21', jei: '19.57.0.451' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile real Forge client APIs and integrate search sources and translations
        run: >
          gradle --no-daemon --console=plain -p ci/review/forge-matrix build
          -Pmc_version=${{ matrix.mc }}
          -Pforge_version=${{ matrix.forge }}
          -Psource_variant=${{ matrix.source }}
          -Pjei_version=${{ matrix.jei }}
          -Pjava_target=${{ matrix.java }}
      - name: Inspect compiled search, client entrypoint and translation files
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find ci/review/forge-matrix/build/libs -maxdepth 1 -name '*.jar' -type f | head -n1)
          test -s "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep 'META-INF/mods.toml'
          unzip -l "$JAR" | grep 'LanguageSearch.*class'
          unzip -l "$JAR" | grep 'LanguageSearchMatcher.class'
          unzip -l "$JAR" | grep 'assets/jei/lang/'
          sha256sum "$JAR"
      - name: Upload JAR for QA, not public publication
        uses: actions/upload-artifact@v4
        with:
          name: forge-search-review-mc-${{ matrix.mc }}-NOT-RUNTIME-TESTED
          path: ci/review/forge-matrix/build/libs/*.jar
          retention-days: 30
          if-no-files-found: error

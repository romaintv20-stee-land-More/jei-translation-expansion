name: Finalize G48 Minecraft 26.1

on:
  workflow_dispatch:
  push:
    branches: ['work/g48-mc26.1-audit']
    paths:
      - '.github/workflows/finalize-g48.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Revalidate G48 resources
        run: |
          python scripts/validate_26_1_delta.py
          python scripts/validate_26_1_complete.py

      - name: Register G48 packaging target
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('packaging/completed-versions.json')
          text = path.read_text(encoding='utf-8')
          data = json.loads(text)
          entry = {
              'generation': 'G48',
              'minecraft': '26.1',
              'jei': '29.2.0',
              'era': 'modern',
              'loader': 'neoforge',
              'neoforge': '26.1.0.8-beta',
              'loader_version_range': '[4,)',
              'neoforge_version_range': '[26.1.0.8-beta,)',
              'jei_modid': 'jei',
              'java_target': 25,
              'format': 'json',
              'full': 64,
              'supplements': 25,
              'keys': 309,
              'reconstruct_script': 'scripts/reconstruct_26_1.py',
          }
          existing = [x for x in data['versions'] if x.get('generation') == 'G48' or x.get('minecraft') == '26.1']
          if existing:
              if existing != [entry]:
                  raise SystemExit(f'conflicting G48 packaging entry: {existing}')
          else:
              old_note = 'G1-G47 are translation/reconstruction complete.'
              new_note = 'G1-G48 are translation/reconstruction complete.'
              if old_note not in text:
                  raise SystemExit('expected G1-G47 packaging note not found')
              text = text.replace(old_note, new_note, 1)
              marker = '\n  ]\n}'
              if marker not in text:
                  raise SystemExit('packaging list terminator not found')
              compact = json.dumps(entry, ensure_ascii=False, separators=(',', ':'))
              text = text.replace(marker, ',\n    ' + compact + marker, 1)
              path.write_text(text, encoding='utf-8')
              data = json.loads(path.read_text(encoding='utf-8'))
          if data['versions'][-1] != entry or len(data['versions']) != 48:
              raise SystemExit('G48 is not the unique latest packaging target')
          print('PASS: registered G48 packaging target')
          PY

      - name: Synchronize upstream registries through G48
        run: python scripts/sync_upstream_registries.py --date 2026-09-15

      - name: Build and inspect G48 NeoForge Java 25 candidate
        shell: bash
        run: |
          python scripts/build_completed_jar_neoforge.py --minecraft '26.1' --version 1.0.0 --output-dir build/g48-candidate
          JAR=$(find build/g48-candidate -maxdepth 1 -name '*.jar' -type f)
          test -n "$JAR"
          test "$(printf '%s\n' "$JAR" | wc -l)" -eq 1
          case "$JAR" in *-mc26.1-neoforge.jar) ;; *) echo 'Unexpected G48 candidate filename'; exit 1;; esac
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -F 'META-INF/neoforge.mods.toml'
          if unzip -l "$JAR" | grep -F 'META-INF/mods.toml'; then
            echo 'Forge mods.toml must not be present in G48 NeoForge candidate'
            exit 1
          fi
          LANG_COUNT=$(unzip -l "$JAR" | grep -c 'assets/jei/lang/.*\.json')
          test "$LANG_COUNT" -eq 89
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -F 'Minecraft-Version: 26.1'
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -F 'JEI-Version: 29.2.0'
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -F 'NeoForge-Version: 26.1.0.8-beta'
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -F 'Java-Version: 25'
          sha256sum "$JAR" | tee build/g48-candidate/SHA256SUMS.txt

      - name: Upload validated G48 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-mc26.1-neoforge-validated
          path: build/g48-candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Commit G48 completion metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/completed-versions.json upstream/versions.json upstream/generations.json
          if git diff --cached --quiet; then
            echo 'G48 completion metadata already current.'
            exit 0
          fi
          git commit -m 'Register G48 Minecraft 26.1 completion metadata'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Validate G39 Minecraft 1.21.1

on:
  workflow_dispatch:
  push:
    branches: ['work/g39-mc1.21.1']
    paths:
      - 'scripts/audit_1_21_1.py'
      - 'scripts/audit_1_21_1_backports.py'
      - 'scripts/audit_1_21_1_addon_donors.py'
      - 'scripts/reconstruct_1_21_1.py'
      - 'scripts/validate_1_21_1_delta.py'
      - 'scripts/validate_1_21_1_complete.py'
      - 'translations/g39-mc1.21.1/**'
      - 'upstream/sources/1.21.1/**'
      - 'upstream/diffs/1.21-to-1.21.1.json'
      - 'upstream/minecraft-1.21.1-language-audit.json'
      - 'upstream/minecraft-1.21.1-language-scope.json'
      - '.github/workflows/audit-g39.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.21.1 / JEI 19.21.1 endpoint
        run: python scripts/audit_1_21_1.py
      - name: Audit exact later-JEI translation backports
        run: python scripts/audit_1_21_1_backports.py
      - name: Audit later-JEI donors for addon-full locales
        run: python scripts/audit_1_21_1_addon_donors.py
      - name: Validate Minecraft 1.21.1 source scope ownership and semantic policy
        run: python scripts/validate_1_21_1_delta.py
      - name: Reconstruct and verify Minecraft 1.21.1 resources
        run: python scripts/reconstruct_1_21_1.py --check
      - name: Validate Minecraft 1.21.1 complete resources
        run: python scripts/validate_1_21_1_complete.py

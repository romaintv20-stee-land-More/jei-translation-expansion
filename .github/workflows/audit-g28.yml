name: Audit G28 Minecraft 1.19

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/audit_1_19.py'
      - 'scripts/reconstruct_1_19.py'
      - 'scripts/validate_1_19_delta.py'
      - 'scripts/validate_1_19_complete.py'
      - 'upstream/sources/1.19/en_us.json'
      - 'upstream/diffs/1.18.2-to-1.19.json'
      - 'upstream/minecraft-1.19-language-audit.json'
      - 'upstream/minecraft-1.19-language-scope.json'
      - 'translations/g28-mc1.19/policy.json'
      - '.github/workflows/audit-g28.yml'
  workflow_dispatch:

jobs:
  audit-g28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit G28 endpoint
        run: python scripts/audit_1_19.py
      - name: Validate G28 source scope and upstream ownership
        run: python scripts/validate_1_19_delta.py
      - name: Reconstruct and verify G28 resources
        run: python scripts/reconstruct_1_19.py --check
      - name: Validate G28 complete resources
        run: python scripts/validate_1_19_complete.py

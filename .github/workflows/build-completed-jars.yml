name: Build latest completed 1.0.0 JAR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/completed-versions.json'
      - 'scripts/build_completed_jar.py'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      minecraft: ${{ steps.latest.outputs.minecraft }}
      expected_count: ${{ steps.latest.outputs.expected_count }}
    steps:
      - uses: actions/checkout@v4
      - id: latest
        name: Read latest completed version
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          data = json.load(open('packaging/completed-versions.json', encoding='utf-8'))
          versions = data['versions']
          assert versions
          assert len({item['minecraft'] for item in versions}) == len(versions)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"minecraft={versions[-1]['minecraft']}\n")
              out.write(f"expected_count={len(versions)}\n")
          PY

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17 builder
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build latest static-validated 1.0.0 candidate
        run: python scripts/build_completed_jar.py --minecraft '${{ needs.prepare.outputs.minecraft }}' --version 1.0.0

      - name: Inspect output
        shell: bash
        run: |
          JAR=$(find 'build/completed-jars/${{ needs.prepare.outputs.minecraft }}' -maxdepth 1 -name '*.jar' -type f)
          test -n "$JAR"
          test "$(printf '%s\n' "$JAR" | wc -l)" -eq 1
          unzip -t "$JAR"
          sha256sum "$JAR"

      - name: Upload latest version JAR
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-mc${{ needs.prepare.outputs.minecraft }}
          path: build/completed-jars/${{ needs.prepare.outputs.minecraft }}/*.jar
          if-no-files-found: error
          retention-days: 30

  persist:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest version artifact
        uses: actions/download-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-mc${{ needs.prepare.outputs.minecraft }}
          path: downloaded-jar

      - name: Store latest candidate in repository tree
        shell: bash
        run: |
          MC='${{ needs.prepare.outputs.minecraft }}'
          EXPECTED='${{ needs.prepare.outputs.expected_count }}'
          mkdir -p "candidate-jars/$MC"
          rm -f "candidate-jars/$MC"/*.jar
          JAR=$(find downloaded-jar -maxdepth 1 -name '*.jar' -type f)
          test -n "$JAR"
          cp "$JAR" "candidate-jars/$MC/$(basename "$JAR")"
          COUNT=$(find candidate-jars -mindepth 2 -maxdepth 2 -name '*.jar' -type f | wc -l)
          test "$COUNT" -eq "$EXPECTED"
          find candidate-jars -mindepth 2 -maxdepth 2 -name '*.jar' -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > candidate-jars/SHA256SUMS.txt
          printf '# Static-validated JAR candidates\n\nThis directory contains %s version-specific JEI Translation Expansion 1.0.0 candidates, currently through Minecraft %s.\n\nThese files have passed the project static/reconstruction QA. They remain outside `release-jars/` until their version-specific runtime gates are complete.\n' "$EXPECTED" "$MC" > candidate-jars/README.md

      - name: Commit latest candidate to GitHub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate-jars
          if git diff --cached --quiet; then
            echo 'Candidate JAR is already current.'
            exit 0
          fi
          git commit -m 'Store Minecraft ${{ needs.prepare.outputs.minecraft }} 1.0.0 JAR candidate'
          git pull --rebase origin main
          git push origin HEAD:main

  bundle:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest version artifact
        uses: actions/download-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-mc${{ needs.prepare.outputs.minecraft }}
          path: latest-jar

      - name: Assemble all completed candidates
        shell: bash
        run: |
          mkdir -p completed-jars
          find candidate-jars -mindepth 2 -maxdepth 2 -name '*.jar' -type f -exec cp '{}' completed-jars/ \;
          cp latest-jar/*.jar completed-jars/
          EXPECTED='${{ needs.prepare.outputs.expected_count }}'
          COUNT=$(find completed-jars -maxdepth 1 -name '*.jar' -type f | wc -l)
          test "$COUNT" -eq "$EXPECTED"
          sha256sum completed-jars/*.jar | sort -k2 > completed-jars/SHA256SUMS.txt
          printf 'JEI Translation Expansion 1.0.0\n%s static-validated version-specific candidates, currently through Minecraft %s.\nRuntime release gates remain separate.\n' "$EXPECTED" '${{ needs.prepare.outputs.minecraft }}' > completed-jars/README.txt

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-completed-versions
          path: completed-jars/
          if-no-files-found: error
          retention-days: 30

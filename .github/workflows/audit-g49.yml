name: Validate G49 Minecraft 26.1.1

on:
  workflow_dispatch:
  push:
    branches: ['work/g49-mc26.1.1-audit']
    paths:
      - 'scripts/audit_26_1_1.py'
      - 'scripts/bootstrap_26_1_1.py'
      - 'scripts/reconstruct_26_1_1.py'
      - 'scripts/validate_26_1_1_delta.py'
      - 'scripts/validate_26_1_1_complete.py'
      - '.github/workflows/audit-g49.yml'
      - 'upstream/sources/26.1/en_us.json'
      - 'upstream/sources/26.1.1/en_us.json'
      - 'upstream/diffs/26.1-to-26.1.1.json'
      - 'upstream/minecraft-26.1-language-scope.json'
      - 'upstream/minecraft-26.1.1-language-audit.json'
      - 'upstream/minecraft-26.1.1-language-scope.json'
      - 'translations/g49-mc26.1.1/policy.json'
      - 'scripts/reconstruct_26_1.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 26.1.1 endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_26_1_1.py
      - name: Freeze G49 manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/bootstrap_26_1_1.py
      - name: Validate frozen G49 delta
        run: python scripts/validate_26_1_1_delta.py
      - name: Validate complete G49 reconstruction
        run: python scripts/validate_26_1_1_complete.py
      - name: Persist frozen G49 manifests to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            upstream/sources/26.1.1/en_us.json \
            upstream/diffs/26.1-to-26.1.1.json \
            upstream/minecraft-26.1.1-language-audit.json \
            upstream/minecraft-26.1.1-language-scope.json \
            translations/g49-mc26.1.1/policy.json
          if git diff --cached --quiet; then
            echo 'Frozen G49 manifests already match.'
            exit 0
          fi
          git commit -m 'Freeze G49 Minecraft 26.1.1 manifests'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

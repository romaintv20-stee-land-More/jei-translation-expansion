name: Validate G19 endpoint

on:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.16.1 / JEI 7.0.1 endpoint
        run: python scripts/audit_1_16_1.py
      - name: Validate Minecraft 1.16.1 source scope and upstream ownership
        run: python scripts/validate_1_16_1_delta.py
      - name: Reconstruct and verify Minecraft 1.16.1 resources
        run: python scripts/reconstruct_1_16_1.py --check
      - name: Validate Minecraft 1.16.1 complete resources
        run: python scripts/validate_1_16_1_complete.py

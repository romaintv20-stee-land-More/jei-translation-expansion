name: Validate G20 endpoint

on:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.16.2 / JEI 7.3.2 endpoint
        run: python scripts/audit_1_16_2.py
      - name: Validate Minecraft 1.16.2 source scope and upstream ownership
        run: python scripts/validate_1_16_2_delta.py
      - name: Reconstruct and verify Minecraft 1.16.2 resources
        run: python scripts/reconstruct_1_16_2.py --check
      - name: Validate Minecraft 1.16.2 complete resources
        run: python scripts/validate_1_16_2_complete.py

name: Export full JEI JAR inventory (53 JARs and visual catalogue)

on:
  push:
    branches:
      - catalogue/jar-inventory-2026-10-18
    paths:
      - .github/workflows/export-full-jar-archive.yml

permissions:
  contents: write

jobs:
  full-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and 52 historical candidate JARs
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and independently verify published Minecraft 26.3 RC1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p downloaded-preview
          gh release download v1.0.1-rc.1-mc26.3-neoforge \
            -p 'jei-translation-expansion-1.0.1-rc.1-mc26.3-neoforge.jar' \
            -D downloaded-preview
          echo '2cb1ae577608ca610b8740c71dd7ce73e85aa13d79511bbba0be983b24b38ff4  downloaded-preview/jei-translation-expansion-1.0.1-rc.1-mc26.3-neoforge.jar' | sha256sum --check
      - name: Verify historical candidate integrity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c candidate-jars/SHA256SUMS.txt
      - name: Assemble master archive, checksum manifest and HTML catalogue
        run: python scripts/assemble_full_jar_archive.py
      - name: Upload verified archive to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: JEI-53-JAR-complete-inventory-2026-10-18
          path: |
            build/jar-archive-2026-10-18/JEI_Translation_Expansion_Tous_les_JAR_2026-10-18.zip
            build/jar-archive-2026-10-18/archive/Inventaire_JAR.csv
            build/jar-archive-2026-10-18/archive/Catalogue_Visuel.html
          retention-days: 90
          if-no-files-found: error
      - name: Write archive publication notes
        shell: bash
        run: |
          cat > build/jar-archive-2026-10-18/BUNDLE_NOTES.md <<'EOF'
          # JEI Translation Expansion — archive de préparation des publications

          **Archive de référence, pas une publication d'un mod multi-version.**

          Cette archive contient les **52 JAR candidats 1.0.0** (Minecraft 1.8 à 26.3, une version Minecraft par JAR) et la **RC1 expérimentale 1.0.1 de Minecraft 26.3** (JEI 31.10.0.63). Total : **53 JAR**. Les 51 builds 1.0.0 hors Minecraft 26.3 avaient des publications séparées. Minecraft 26.3 1.0.0 reste un candidat.

          Le ZIP contient le catalogue HTML, l'inventaire CSV/JSON, les empreintes SHA-256 et des instructions de publication.

          **ATTENTION** : une publication ou une vérification de packaging n'est pas une validation en jeu. Les JAR 1.0.0 n'intègrent pas nécessairement les nouvelles langues, la recherche et les polices prévues par la branche de développement. Ne pas présenter les 53 versions comme toutes fonctionnellement validées. Aucun JAR Fabric n'est inclus.

          Pour publier un fichier précis, vérifier d'abord Minecraft, loader, version de JEI, version Java et les tests en jeu.
          EOF
      - name: Publish dated archive as GitHub prerelease (not a stable mod release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='inventaire-jars-2026-10-18'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Dated archive release already exists: refusing overwrite."
            exit 1
          fi
          gh release create "$TAG" \
            build/jar-archive-2026-10-18/JEI_Translation_Expansion_Tous_les_JAR_2026-10-18.zip \
            build/jar-archive-2026-10-18/archive/Inventaire_JAR.csv \
            build/jar-archive-2026-10-18/archive/Catalogue_Visuel.html \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'Inventaire JEI — 53 JAR + catalogue (18-10-2026, tests jeu en attente)' \
            --notes-file build/jar-archive-2026-10-18/BUNDLE_NOTES.md

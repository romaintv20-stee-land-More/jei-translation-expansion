name: Finalize G43 Minecraft 1.21.7

on:
  workflow_dispatch:
  push:
    branches: ['work/g43-mc1.21.7-audit']
    paths:
      - '.github/workflows/finalize-g43.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Revalidate G43 resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_1_21_7_delta.py
          python scripts/validate_1_21_7_complete.py

      - name: Register G43 packaging target
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('packaging/completed-versions.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['versions'][-1]['generation'] == 'G42'
          assert not any(v['generation'] == 'G43' for v in data['versions'])
          data['versions'].append({
              'generation': 'G43',
              'minecraft': '1.21.7',
              'jei': '23.1.0',
              'era': 'modern',
              'loader': 'neoforge',
              'neoforge': '21.7.15-beta',
              'loader_version_range': '[4,)',
              'neoforge_version_range': '[21.7.15-beta,)',
              'jei_modid': 'jei',
              'java_target': 21,
              'format': 'json',
              'full': 65,
              'supplements': 23,
              'keys': 291,
              'reconstruct_script': 'scripts/reconstruct_1_21_7.py',
          })
          data['note'] = 'G1-G43 are translation/reconstruction complete. These builds are static-validated release candidates until their required runtime gates are complete.'

          lines = [
              '{',
              f'  "schema_version": {data["schema_version"]},',
              f'  "project_version": {json.dumps(data["project_version"])},',
              f'  "note": {json.dumps(data["note"])},',
              '  "versions": [',
          ]
          for i, item in enumerate(data['versions']):
              suffix = ',' if i + 1 < len(data['versions']) else ''
              lines.append('    ' + json.dumps(item, ensure_ascii=False, separators=(',', ':')) + suffix)
          lines += ['  ]', '}', '']
          path.write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Synchronize upstream registries through G43
        run: python scripts/sync_upstream_registries.py --date 2026-09-15

      - name: Build and inspect G43 NeoForge candidate
        shell: bash
        run: |
          python scripts/build_completed_jar_neoforge.py --minecraft 1.21.7 --version 1.0.0 --output-dir build/g43-package
          JAR=$(find build/g43-package -maxdepth 1 -name '*.jar' -type f)
          test -n "$JAR"
          test "$(printf '%s\n' "$JAR" | wc -l)" -eq 1
          case "$JAR" in *-mc1.21.7-neoforge.jar) ;; *) echo 'Unexpected G43 filename'; exit 1;; esac
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -F 'META-INF/neoforge.mods.toml'
          if unzip -l "$JAR" | grep -F 'META-INF/mods.toml'; then
            echo 'Forge metadata leaked into G43 NeoForge JAR'
            exit 1
          fi
          SHA=$(sha256sum "$JAR" | awk '{print $1}')
          printf '%s\n' "$SHA" > build/g43-package/SHA256.txt
          echo "G43_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Synchronize canonical status through validated G43
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('PROJECT_STATUS.md')
          text = path.read_text(encoding='utf-8')
          row42 = '| G42 | 1.21.6 | 22.0.0 | `2a57409` | 289 | 90 | 65 | 24 | 1 | complete; NeoForge packaging validated |'
          row43 = '| G43 | 1.21.7 | 23.1.0 | `ee33b5d` | 291 | 90 | 65 | 23 | 2 | complete; NeoForge packaging validated |'
          if row43 not in text:
              if row42 not in text:
                  raise SystemExit('G42 status row not found')
              text = text.replace(row42, row42 + '\n' + row43, 1)

          marker = '## Candidate packaging state'
          if '### G43 — Minecraft 1.21.7 / JEI 23.1.0' not in text:
              milestone = f'''### G43 — Minecraft 1.21.7 / JEI 23.1.0\n\n- final 1.21.7 mainline endpoint `ee33b5d69f6cf9167c32c2e84fdc69fa1b008440`\n- next Minecraft port `f61efdf5f6604d0d3a55a67cc5d28ec340f189aa` targets 1.21.8 and directly follows the G43 endpoint\n- build: NeoForge `21.7.15-beta`, minimum `[21.7.15-beta,)`, Java 21\n- 291 keys = 285 normal + 6 debug\n- G42→G43 semantic delta = 289 unchanged + 2 added + 0 removed + 0 changed-English values\n- added keys: `gui.jei.category.grindstone` and `gui.jei.category.grindstone.experience`\n- the reintroduced grindstone-experience key may reuse G41 only for exact same-key/same-English semantics; cross-key reuse remains forbidden\n- selected scope remains 90; ownership = 65 addon/full-override + 23 missing-key-only supplements + 2 complete upstream (`en_us`, `zh_cn`)\n- pinned `uk_ua.json` remains malformed and is handled as a deterministic full repair override\n- complete isolated validation run `34934366667`, green\n- deterministic NeoForge package SHA-256 `{os.environ['G43_SHA']}`\n- runtime promotion remains separately gated\n\n'''
              text = text.replace(marker, milestone + marker, 1)

          start = text.index('## Candidate packaging state')
          end = text.index('## Current next target')
          candidate = '''## Candidate packaging state\n\n- The canonical candidate inventory on `main` contains **42 version-specific 1.0.0 candidates through Minecraft 1.21.6**.\n- G43 has passed complete translation/reconstruction QA and deterministic NeoForge packaging on the work branch; canonical `candidate-jars/1.21.7/` persistence follows merge to `main`.\n- Candidate JARs are not runtime-promoted finals.\n\n'''
          text = text[:start] + candidate + text[end:]

          start = text.index('## Current next target')
          end = text.index('## Documentation synchronization debt')
          current = '''## Current next target\n\n- Merge the completed G43 / Minecraft 1.21.7 work and let the main packaging workflow persist its NeoForge candidate.\n- The chronological next audit target is **G44 = Minecraft 1.21.8**.\n- Keep all static candidates outside `release-jars/` until their runtime gates are satisfied.\n\n'''
          text = text[:start] + current + text[end:]

          start = text.index('## Documentation synchronization debt')
          end = text.index('## Release gates still open')
          debt = '''## Documentation synchronization debt\n\n- `PROJECT_STATUS.md`, `upstream/versions.json`, and `upstream/generations.json` are synchronized through completed G43.\n- `README.md`, `docs/VERSION_MATRIX.md`, and `docs/TRANSLATION_STATUS.md` remain synchronized through G42 and should be advanced through G43 before final public release preparation.\n\n'''
          text = text[:start] + debt + text[end:]
          text = text.replace('G39–G42 NeoForge candidates remain static candidates', 'G39–G43 NeoForge candidates remain static candidates')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Upload G43 validated candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-mc1.21.7-neoforge
          path: |
            build/g43-package/*.jar
            build/g43-package/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit G43 completion metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-g43.yml
          git add \
            packaging/completed-versions.json \
            upstream/versions.json \
            upstream/generations.json \
            PROJECT_STATUS.md \
            .github/workflows/finalize-g43.yml
          git commit -m 'Finalize G43 Minecraft 1.21.7 translations and packaging'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

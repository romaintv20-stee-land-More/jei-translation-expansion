name: Validate G44 Minecraft 1.21.8

on:
  workflow_dispatch:
  push:
    branches: ['work/g44-mc1.21.8-audit']
    paths:
      - 'scripts/reconstruct_1_21_8.py'
      - 'scripts/validate_1_21_8_delta.py'
      - 'scripts/validate_1_21_8_complete.py'
      - '.github/workflows/validate-g44.yml'
      - 'upstream/sources/1.21.8/en_us.json'
      - 'upstream/diffs/1.21.7-to-1.21.8.json'
      - 'upstream/minecraft-1.21.8-language-audit.json'
      - 'upstream/minecraft-1.21.8-language-scope.json'
      - 'translations/g44-mc1.21.8/policy.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen G44 source and ownership
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_1_21_8_delta.py
      - name: Reconstruct G44 resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/reconstruct_1_21_8.py --output build/reconstructed/1.21.8
      - name: Validate complete G44 resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_1_21_8_complete.py

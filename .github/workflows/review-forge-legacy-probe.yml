name: Probe authentic ForgeGradle2 legacy search API (1.8.9, 1.11.2, 1.12.1)

on:
  push:
    branches: [feature/complete-all-52-jars-2026-10-18]
    paths:
      - '.github/workflows/review-forge-legacy-probe.yml'
      - 'ci/review/forge-1.8-1.12/**'
      - 'features/language-search/legacy_1_8_to_1_12/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mc: '1.8.9', forge: '11.15.1.2318', map: 'stable_22', jei: '2.28.18', fg: '2.1-SNAPSHOT'}
          - {mc: '1.11.2', forge: '13.20.1.2588', map: 'stable_32', jei: '4.5.1', fg: '2.2-SNAPSHOT'}
          - {mc: '1.12.1', forge: '14.22.1.2485', map: 'stable_39', jei: '4.7.8', fg: '2.3-SNAPSHOT'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Compile real legacy Forge language picker
        run: >
          gradle --no-daemon --console=plain -p ci/review/forge-1.8-1.12 build
          -Pmc_version=${{ matrix.mc }}
          -Pforge_version=${{ matrix.forge }}
          -Pmappings_id=${{ matrix.map }}
          -Pjei_version=${{ matrix.jei }}
          -Pfg_version=${{ matrix.fg }}
      - name: Inspect JAR and Java search listener
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find ci/review/forge-1.8-1.12/build/libs -name '*-forge.jar' | head -n1)
          test -s "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -F 'LanguageSearchLegacyForge.class'
          unzip -l "$JAR" | grep 'assets/jei/lang/'
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-probe-mc-${{ matrix.mc }}-NOT-GAME-TESTED
          path: ci/review/forge-1.8-1.12/build/libs/*-forge.jar
          retention-days: 30
          if-no-files-found: error

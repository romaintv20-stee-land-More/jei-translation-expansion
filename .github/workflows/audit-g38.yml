name: Audit G38 Minecraft 1.21

on:
  workflow_dispatch:
  push:
    branches: ['work/g38-mc1.21']
    paths:
      - 'scripts/audit_1_21.py'
      - '.github/workflows/audit-g38.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.21 / JEI 19.8.2 endpoint
        run: python scripts/audit_1_21.py

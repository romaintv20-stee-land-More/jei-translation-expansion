name: Audit G37 Minecraft 1.20.6

on:
  workflow_dispatch:
  push:
    branches: ['work/g37-mc1.20.6']
    paths:
      - 'scripts/audit_1_20_6.py'
      - '.github/workflows/audit-g37.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.20.6 / JEI 18.0.0 endpoint
        run: python scripts/audit_1_20_6.py

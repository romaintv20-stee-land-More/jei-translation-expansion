name: Validate G37 Minecraft 1.20.6

on:
  workflow_dispatch:
  push:
    branches: ['work/g37-mc1.20.6']
    paths:
      - 'scripts/audit_1_20_6.py'
      - 'scripts/reconstruct_1_20_6.py'
      - 'scripts/validate_1_20_6_delta.py'
      - 'scripts/validate_1_20_6_complete.py'
      - 'upstream/sources/1.20.6/en_us.json'
      - 'upstream/diffs/1.20.4-to-1.20.6.json'
      - 'upstream/minecraft-1.20.6-language-scope.json'
      - 'upstream/minecraft-1.20.6-language-audit.json'
      - 'translations/g37-mc1.20.6/policy.json'
      - '.github/workflows/audit-g37.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.20.6 / JEI 18.0.0 endpoint
        run: python scripts/audit_1_20_6.py
      - name: Validate Minecraft 1.20.6 source scope and upstream ownership
        run: python scripts/validate_1_20_6_delta.py
      - name: Reconstruct and verify Minecraft 1.20.6 resources
        run: python scripts/reconstruct_1_20_6.py --check
      - name: Validate Minecraft 1.20.6 complete resources
        run: python scripts/validate_1_20_6_complete.py

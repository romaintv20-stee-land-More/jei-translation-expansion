name: Audit G45 Minecraft 1.21.9

on:
  workflow_dispatch:
  push:
    branches: ['work/g45-mc1.21.9-audit']
    paths:
      - 'scripts/audit_1_21_9.py'
      - '.github/workflows/audit-g45.yml'
      - 'upstream/sources/1.21.8/en_us.json'
      - 'upstream/minecraft-1.21.8-language-scope.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.21.9 endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_1_21_9.py

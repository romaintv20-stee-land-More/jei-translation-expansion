name: Validate G45 Minecraft 1.21.9

on:
  workflow_dispatch:
  push:
    branches: ['work/g45-mc1.21.9-audit']
    paths:
      - 'scripts/audit_1_21_9.py'
      - 'scripts/bootstrap_1_21_9.py'
      - 'scripts/reconstruct_1_21_9.py'
      - 'scripts/validate_1_21_9_delta.py'
      - 'scripts/validate_1_21_9_complete.py'
      - '.github/workflows/audit-g45.yml'
      - 'upstream/sources/1.21.8/en_us.json'
      - 'upstream/sources/1.21.9/en_us.json'
      - 'upstream/diffs/1.21.8-to-1.21.9.json'
      - 'upstream/minecraft-1.21.8-language-scope.json'
      - 'upstream/minecraft-1.21.9-language-audit.json'
      - 'upstream/minecraft-1.21.9-language-scope.json'
      - 'translations/g45-mc1.21.9/policy.json'
      - 'scripts/reconstruct_1_21_8.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.21.9 endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_1_21_9.py
      - name: Freeze G45 manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/bootstrap_1_21_9.py
      - name: Validate frozen G45 delta
        run: python scripts/validate_1_21_9_delta.py
      - name: Validate complete G45 reconstruction
        run: python scripts/validate_1_21_9_complete.py
      - name: Persist frozen G45 manifests to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            upstream/sources/1.21.9/en_us.json \
            upstream/diffs/1.21.8-to-1.21.9.json \
            upstream/minecraft-1.21.9-language-audit.json \
            upstream/minecraft-1.21.9-language-scope.json \
            translations/g45-mc1.21.9/policy.json
          if git diff --cached --quiet; then
            echo 'Frozen G45 manifests already match.'
            exit 0
          fi
          git commit -m 'Freeze G45 Minecraft 1.21.9 manifests'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

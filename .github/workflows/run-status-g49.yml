name: Run G49 status synchronization

on:
  workflow_dispatch:
  push:
    branches: ['work/g49-mc26.1.1-audit']
    paths:
      - '.github/workflows/run-status-g49.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize canonical status
        run: python scripts/sync_project_status_g49.py
      - name: Commit canonical status
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATUS.md
          if git diff --cached --quiet; then
            echo 'PROJECT_STATUS.md already synchronized.'
            exit 0
          fi
          git commit -m 'Synchronize canonical status through G49'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

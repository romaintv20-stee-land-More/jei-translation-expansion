name: Synchronize G46 status

on:
  workflow_dispatch:
  push:
    branches: ['work/g46-mc1.21.10-audit']
    paths:
      - '.github/workflows/sync-g46-status.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical status files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          project = Path('PROJECT_STATUS.md')
          text = project.read_text(encoding='utf-8')
          row45 = '| G45 | 1.21.9 | 25.0.1 | `bdfdb4c` | 305 | 90 | 65 | 24 | 1 | complete; NeoForge packaging validated |'
          row46 = '| G46 | 1.21.10 | 26.2.0 | `621ddf0` | 308 | 90 | 64 | 25 | 1 | complete; NeoForge packaging validated |'
          if row46 not in text:
              if row45 not in text:
                  raise SystemExit('G45 project-status row not found')
              text = text.replace(row45, row45 + '\n' + row46, 1)

          milestone = '''### G46 — Minecraft 1.21.10 / JEI 26.2.0

- final 1.21.10 mainline endpoint `621ddf003a8eceffcba0fd808a955e280f87a4c0`
- next Minecraft port `6b615d15ef776abf139339779985a91c59c9c324` targets 1.21.11 and is directly parented by the G46 endpoint; upstream explicitly marks 1.21.11 as Maven-only
- build: NeoForge `21.10.64`, minimum `[21.9.2-beta,)`, Java 21
- 308 keys = 302 normal + 6 debug
- G45→G46 semantic delta = 305 unchanged + 3 added + 0 removed + 0 changed-English values
- added keys: `jei.config.client.tooltips.enableRecipesGuiIngredientsSummary`, `jei.config.client.tooltips.enableRecipesGuiIngredientsSummary.description`, and `jei.tooltip.recipe.tooltips.craft.ingredients`
- selected scope remains 90; ownership = 64 addon-full locales + 25 missing-key/safety-override supplements + 1 complete upstream (`en_us`)
- `uk_ua` is valid upstream again in G46 and returns to supplement ownership instead of a full repair override
- 92 frozen upstream-owned values require literal-safety overrides; all emitted/combined values preserve required placeholders and fixed technical literals
- deterministic NeoForge candidate SHA-256 `f0370c0a9bd5bc26d98ae624237a0b39a14c275eeaf54964ffd2c8caef223f8d`
- final packaging-validation run `34964123873`, green
- runtime promotion remains separately gated

'''
          marker = '## Candidate packaging state\n'
          if '### G46 — Minecraft 1.21.10 / JEI 26.2.0' not in text:
              if marker not in text:
                  raise SystemExit('candidate packaging marker not found')
              text = text.replace(marker, milestone + marker, 1)

          old_candidate = '''- The canonical candidate inventory on `main` contains **44 version-specific 1.0.0 candidates through Minecraft 1.21.8**.
- G45 has passed complete translation/reconstruction QA and deterministic NeoForge packaging on the work branch; canonical `candidate-jars/1.21.9/` persistence follows merge to `main`.
- Candidate JARs are not runtime-promoted finals.'''
          new_candidate = '''- The canonical candidate inventory on `main` contains **45 version-specific 1.0.0 candidates through Minecraft 1.21.9**.
- G46 has passed complete translation/reconstruction QA and deterministic NeoForge packaging on the work branch; canonical `candidate-jars/1.21.10/` persistence follows merge to `main`.
- Candidate JARs are not runtime-promoted finals.'''
          if old_candidate in text:
              text = text.replace(old_candidate, new_candidate, 1)

          old_next = '''- Merge the completed G45 / Minecraft 1.21.9 work and let the main packaging workflow persist its NeoForge candidate.
- The chronological next audit target is **G46 = Minecraft 1.21.10**.
- Keep all static candidates outside `release-jars/` until their runtime gates are satisfied.'''
          new_next = '''- Merge the completed G46 / Minecraft 1.21.10 work and let the main packaging workflow persist its NeoForge candidate.
- The chronological next audit target is **G47 = Minecraft 1.21.11**; upstream explicitly states that this JEI Minecraft target is Maven-only, so its packaging/publication implications must be kept distinct from translation auditing.
- Keep all static candidates outside `release-jars/` until their runtime gates are satisfied.'''
          if old_next in text:
              text = text.replace(old_next, new_next, 1)

          text = text.replace('`PROJECT_STATUS.md`, `upstream/versions.json`, and `upstream/generations.json` are synchronized through completed G45.', '`PROJECT_STATUS.md`, `upstream/versions.json`, and `upstream/generations.json` are synchronized through completed G46.', 1)
          text = text.replace('G39–G45 NeoForge candidates remain static candidates', 'G39–G46 NeoForge candidates remain static candidates', 1)
          project.write_text(text, encoding='utf-8')

          status = Path('docs/TRANSLATION_STATUS.md')
          text = status.read_text(encoding='utf-8')
          srow45 = '| G45 | 1.21.9 | 25.0.1 | 305 | 90 | 65 | 24 | 1 | complete |'
          srow46 = '| G46 | 1.21.10 | 26.2.0 | 308 | 90 | 64 | 25 | 1 | complete |'
          if srow46 not in text:
              if srow45 not in text:
                  raise SystemExit('G45 translation-status row not found')
              text = text.replace(srow45, srow45 + '\n' + srow46, 1)

          status_milestone = '''### G46 — Minecraft 1.21.10 / JEI 26.2.0

- Final endpoint: `621ddf003a8eceffcba0fd808a955e280f87a4c0`.
- Direct next port: `6b615d15ef776abf139339779985a91c59c9c324` → Minecraft 1.21.11; upstream marks that target Maven-only.
- Build: NeoForge `21.10.64`, minimum `[21.9.2-beta,)`, Java 21.
- 308 keys = 302 normal + 6 debug.
- G45→G46: 305 unchanged, 3 added, 0 removed, 0 changed-English values.
- Selected scope remains 90; ownership is 64 addon-full + 25 supplements + 1 complete upstream (`en_us`).
- `uk_ua` is valid upstream again and is supplement-owned rather than a full repair override.
- Complete reconstruction and deterministic NeoForge packaging are green.
- Candidate SHA-256: `f0370c0a9bd5bc26d98ae624237a0b39a14c275eeaf54964ffd2c8caef223f8d`.

'''
          current_marker = '## Current generation\n'
          if '### G46 — Minecraft 1.21.10 / JEI 26.2.0' not in text:
              if current_marker not in text:
                  raise SystemExit('translation current-generation marker not found')
              text = text.replace(current_marker, status_milestone + current_marker, 1)

          text = text.replace('G45 translation/reconstruction and static candidate packaging are complete on its work branch. After merge and canonical candidate persistence, the next chronological audit target is **G46 / Minecraft 1.21.10**.', 'G46 translation/reconstruction and static candidate packaging are complete on its work branch. After merge and canonical candidate persistence, the next chronological audit target is **G47 / Minecraft 1.21.11**, which upstream explicitly marks as Maven-only.', 1)
          status.write_text(text, encoding='utf-8')
          PY

          git diff --check
      - name: Commit synchronized status
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATUS.md docs/TRANSLATION_STATUS.md
          if git diff --cached --quiet; then
            echo 'Status files already synchronized through G46.'
            exit 0
          fi
          git commit -m 'Synchronize canonical status through G46'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Package G42 Minecraft 1.21.6 candidate

on:
  workflow_dispatch:
  push:
    branches: ['work/g42-mc1.21.6-audit']
    paths:
      - '.github/workflows/package-g42.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Recompute and validate G42 manifests and reconstruction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_1_21_6.py
          python scripts/bootstrap_1_21_6.py
          python scripts/validate_1_21_6_delta.py
          python scripts/validate_1_21_6_complete.py
      - name: Register G42 packaging target in worktree
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config_path = Path('packaging/completed-versions.json')
          scope = json.loads(Path('upstream/minecraft-1.21.6-language-scope.json').read_text(encoding='utf-8'))
          data = json.loads(config_path.read_text(encoding='utf-8'))
          full = len(scope['addon_full_locales'])
          supplements = len(scope['selected_upstream_incomplete_locales'])
          complete = len(scope['selected_upstream_complete_locales'])
          assert full + supplements + complete == 90
          entry = {
              'generation': 'G42',
              'minecraft': '1.21.6',
              'jei': '22.0.0',
              'era': 'modern',
              'loader': 'neoforge',
              'neoforge': '21.6.20-beta',
              'loader_version_range': '[4,)',
              'neoforge_version_range': '[21.6.20-beta,)',
              'jei_modid': 'jei',
              'java_target': 21,
              'format': 'json',
              'full': full,
              'supplements': supplements,
              'keys': 289,
              'reconstruct_script': 'scripts/reconstruct_1_21_6.py',
          }
          existing = [x for x in data['versions'] if x.get('generation') == 'G42' or x.get('minecraft') == '1.21.6']
          if existing:
              assert existing == [entry], existing
          else:
              assert data['versions'][-1]['generation'] == 'G41'
              data['versions'].append(entry)
          data['note'] = 'G1-G42 are translation/reconstruction complete. These builds are static-validated release candidates until their required runtime gates are complete.'
          config_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print(f'G42 packaging ownership: {full} full + {supplements} supplements + {complete} complete upstream')
          PY
      - name: Build Minecraft 1.21.6 NeoForge candidate
        run: python scripts/build_completed_jar_neoforge.py --minecraft 1.21.6 --version 1.0.0
      - name: Inspect candidate
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/completed-jars/1.21.6 -maxdepth 1 -name '*.jar' -type f)
          test -n "$JAR"
          test "$(printf '%s\n' "$JAR" | wc -l)" -eq 1
          case "$JAR" in *-mc1.21.6-neoforge.jar) ;; *) echo 'Unexpected candidate filename'; exit 1;; esac
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -F 'META-INF/neoforge.mods.toml'
          if unzip -l "$JAR" | grep -F 'META-INF/mods.toml'; then
            echo 'Forge mods.toml leaked into NeoForge candidate'
            exit 1
          fi
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'versionRange="[1.21.6]"'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'versionRange="[22.0.0]"'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'versionRange="[21.6.20-beta,)"'
          EXPECTED=$(python - <<'PY'
          import json
          s=json.load(open('upstream/minecraft-1.21.6-language-scope.json', encoding='utf-8'))
          print(len(s['addon_full_locales']) + len(s['selected_upstream_incomplete_locales']))
          PY
          )
          COUNT=$(unzip -l "$JAR" | awk '$4 ~ /^assets\/jei\/lang\/.*\.json$/ {count++} END {print count+0}')
          test "$COUNT" -eq "$EXPECTED"
          sha256sum "$JAR"
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-mc1.21.6-neoforge
          path: build/completed-jars/1.21.6/*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Persist G42 packaging target to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/completed-versions.json
          if git diff --cached --quiet; then
            echo 'G42 packaging target already persisted.'
            exit 0
          fi
          git commit -m 'Register G42 Minecraft 1.21.6 packaging target'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Finalize G42 Minecraft 1.21.6 metadata

on:
  workflow_dispatch:
  push:
    branches: ['work/g42-mc1.21.6-audit']
    paths:
      - '.github/workflows/package-g42.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register G42 packaging target without reformatting historical entries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('packaging/completed-versions.json')
          text = path.read_text(encoding='utf-8')
          scope = json.loads(Path('upstream/minecraft-1.21.6-language-scope.json').read_text(encoding='utf-8'))
          full = len(scope['addon_full_locales'])
          supplements = len(scope['selected_upstream_incomplete_locales'])
          complete = len(scope['selected_upstream_complete_locales'])
          assert (full, supplements, complete) == (65, 24, 1)

          old_note = '"note": "G1-G41 are translation/reconstruction complete. These builds are static-validated release candidates until their required runtime gates are complete.",'
          new_note = '"note": "G1-G42 are translation/reconstruction complete. These builds are static-validated release candidates until their required runtime gates are complete.",'
          g41 = '    {"generation":"G41","minecraft":"1.21.5","jei":"21.4.0","era":"modern","loader":"neoforge","neoforge":"21.5.75","loader_version_range":"[4,)","neoforge_version_range":"[21.5.74,)","jei_modid":"jei","java_target":21,"format":"json","full":65,"supplements":24,"keys":290,"reconstruct_script":"scripts/reconstruct_1_21_5.py"}'
          g42 = '    {"generation":"G42","minecraft":"1.21.6","jei":"22.0.0","era":"modern","loader":"neoforge","neoforge":"21.6.20-beta","loader_version_range":"[4,)","neoforge_version_range":"[21.6.20-beta,)","jei_modid":"jei","java_target":21,"format":"json","full":65,"supplements":24,"keys":289,"reconstruct_script":"scripts/reconstruct_1_21_6.py"}'

          if '"generation":"G42"' not in text:
              if old_note not in text:
                  raise SystemExit('Expected G1-G41 packaging note not found')
              if g41 + '\n  ]' not in text:
                  raise SystemExit('Expected final G41 packaging entry not found')
              text = text.replace(old_note, new_note, 1)
              text = text.replace(g41 + '\n  ]', g41 + ',\n' + g42 + '\n  ]', 1)
              path.write_text(text, encoding='utf-8')
          else:
              data = json.loads(text)
              latest = data['versions'][-1]
              assert latest == {
                  'generation':'G42','minecraft':'1.21.6','jei':'22.0.0','era':'modern',
                  'loader':'neoforge','neoforge':'21.6.20-beta','loader_version_range':'[4,)',
                  'neoforge_version_range':'[21.6.20-beta,)','jei_modid':'jei','java_target':21,
                  'format':'json','full':65,'supplements':24,'keys':289,
                  'reconstruct_script':'scripts/reconstruct_1_21_6.py'
              }
          print('PASS: G42 packaging target registered in canonical file style')
          PY
      - name: Synchronize upstream registries through G42
        run: python scripts/sync_upstream_registries.py --date 2026-09-15
      - name: Validate synchronized registry endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('packaging/completed-versions.json', encoding='utf-8'))
          v=json.load(open('upstream/versions.json', encoding='utf-8'))
          g=json.load(open('upstream/generations.json', encoding='utf-8'))
          assert len(p['versions']) == 42
          assert p['versions'][-1]['generation'] == 'G42'
          assert p['versions'][-1]['minecraft'] == '1.21.6'
          verified=[x for x in v['versions'] if x.get('verified')]
          assert len(verified) == 42
          assert verified[-1]['generation'] == 'G42'
          assert verified[-1]['minecraft'] == '1.21.6'
          assert len(g['generations']) == 42
          assert g['generations'][-1]['id'] == 'g42-mc1.21.6'
          assert g['status'] == 'complete-through-g42'
          print('PASS: packaging and upstream registries synchronized through G42')
          PY
      - name: Commit finalized G42 metadata to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/completed-versions.json upstream/versions.json upstream/generations.json
          if git diff --cached --quiet; then
            echo 'G42 metadata is already finalized.'
            exit 0
          fi
          git commit -m 'Finalize G42 packaging and upstream registries'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

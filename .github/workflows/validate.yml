name: Validate translations

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Minecraft 1.8 translations
        run: python scripts/validate_translations.py
      - name: Validate Minecraft 1.8.9 translation deltas
        run: python scripts/validate_1_8_9_delta.py
      - name: Validate Minecraft 1.8.9 upstream locale supplements
        run: python scripts/validate_1_8_9_upstream_supplements.py
      - name: Reconstruct and verify Minecraft 1.8.9 complete locales
        run: python scripts/reconstruct_1_8_9.py --check
      - name: Validate Minecraft 1.9 translation deltas
        run: python scripts/validate_1_9_delta.py
      - name: Reconstruct and verify Minecraft 1.9 resources
        run: python scripts/reconstruct_1_9.py --check
      - name: Validate Minecraft 1.9 complete resources
        run: python scripts/validate_1_9_complete.py
      - name: Validate Minecraft 1.9.4 translation deltas
        run: python scripts/validate_1_9_4_delta.py
      - name: Reconstruct and verify Minecraft 1.9.4 resources
        run: python scripts/reconstruct_1_9_4.py --check
      - name: Validate Minecraft 1.9.4 complete resources
        run: python scripts/validate_1_9_4_complete.py
      - name: Validate Minecraft 1.10 source scope and upstream ownership
        run: python scripts/validate_1_10_delta.py
      - name: Reconstruct and verify Minecraft 1.10 resources

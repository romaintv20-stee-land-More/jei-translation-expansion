name: Audit G32 Minecraft 1.19.4

on:
  workflow_dispatch:
  push:
    branches: ['work/g32-mc1.19.4']
    paths:
      - 'scripts/audit_1_19_4.py'
      - '.github/workflows/audit-g32.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.19.4 / JEI 13.1.0 endpoint
        run: python scripts/audit_1_19_4.py

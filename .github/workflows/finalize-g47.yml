name: Finalize G47 Minecraft 1.21.11

on:
  workflow_dispatch:
  push:
    branches: ['work/g47-mc1.21.11-packaging']
    paths:
      - '.github/workflows/finalize-g47.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Revalidate G47 delta and reconstruction
        run: |
          python scripts/validate_1_21_11_delta.py
          python scripts/validate_1_21_11_complete.py

      - name: Register G47 packaging target
        run: python scripts/register_g47_packaging.py

      - name: Synchronize upstream registries through G47
        run: python scripts/sync_upstream_registries.py --date 2026-09-15

      - name: Build G47 NeoForge candidate
        run: |
          python scripts/build_completed_jar_neoforge.py \
            --minecraft 1.21.11 \
            --version 1.0.0 \
            --output-dir build/g47-candidate

      - name: Inspect G47 candidate
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/g47-candidate -maxdepth 1 -name '*.jar' -type f)
          test -n "$JAR"
          test "$(printf '%s\n' "$JAR" | wc -l)" -eq 1
          case "$JAR" in
            *jei-translation-expansion-1.0.0-mc1.21.11-neoforge.jar) ;;
            *) echo "Unexpected candidate filename: $JAR"; exit 1;;
          esac
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -F 'META-INF/neoforge.mods.toml'
          if unzip -l "$JAR" | grep -F 'META-INF/mods.toml'; then
            echo 'Forge mods.toml must not be present in the NeoForge candidate'
            exit 1
          fi
          COUNT=$(unzip -Z1 "$JAR" | grep '^assets/jei/lang/.*\.json$' | wc -l)
          test "$COUNT" -eq 89
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'versionRange="[1.21.11]"'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'versionRange="[27.38.0]"'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'versionRange="[21.11.44,)"'
          sha256sum "$JAR" | tee build/g47-candidate/SHA256SUMS.txt

      - name: Upload validated G47 candidate
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-mc1.21.11-neoforge
          path: build/g47-candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Commit G47 packaging and registry metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/completed-versions.json upstream/versions.json upstream/generations.json
          if git diff --cached --quiet; then
            echo 'G47 packaging metadata already current.'
            exit 0
          fi
          git commit -m 'Complete G47 Minecraft 1.21.11 packaging metadata'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

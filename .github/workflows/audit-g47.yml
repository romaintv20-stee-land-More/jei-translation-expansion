name: Validate G47 Minecraft 1.21.11

on:
  workflow_dispatch:
  push:
    branches: ['work/g47-mc1.21.11-audit']
    paths:
      - 'scripts/audit_1_21_11.py'
      - 'scripts/bootstrap_1_21_11.py'
      - 'scripts/reconstruct_1_21_11.py'
      - 'scripts/validate_1_21_11_delta.py'
      - 'scripts/validate_1_21_11_complete.py'
      - 'scripts/sync_g47_docs.py'
      - '.github/workflows/audit-g47.yml'
      - 'upstream/sources/1.21.10/en_us.json'
      - 'upstream/sources/1.21.11/en_us.json'
      - 'upstream/diffs/1.21.10-to-1.21.11.json'
      - 'upstream/minecraft-1.21.10-language-scope.json'
      - 'upstream/minecraft-1.21.11-language-audit.json'
      - 'upstream/minecraft-1.21.11-language-scope.json'
      - 'translations/g47-mc1.21.11/policy.json'
      - 'scripts/reconstruct_1_21_10.py'
      - 'PROJECT_STATUS.md'
      - 'docs/TRANSLATION_STATUS.md'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit maintained Minecraft 1.21.11 endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_1_21_11.py
      - name: Freeze G47 manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/bootstrap_1_21_11.py
      - name: Validate frozen G47 delta
        run: python scripts/validate_1_21_11_delta.py
      - name: Validate complete G47 reconstruction
        run: python scripts/validate_1_21_11_complete.py
      - name: Synchronize maintained G47 documentation
        run: python scripts/sync_g47_docs.py
      - name: Persist frozen G47 manifests and docs to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            upstream/sources/1.21.11/en_us.json \
            upstream/diffs/1.21.10-to-1.21.11.json \
            upstream/minecraft-1.21.11-language-audit.json \
            upstream/minecraft-1.21.11-language-scope.json \
            translations/g47-mc1.21.11/policy.json \
            PROJECT_STATUS.md \
            docs/TRANSLATION_STATUS.md
          if git diff --cached --quiet; then
            echo 'Frozen G47 manifests and docs already match.'
            exit 0
          fi
          git commit -m 'Freeze maintained G47 manifests and documentation'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

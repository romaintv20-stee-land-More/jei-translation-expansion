name: Build Forge Minecraft 1.20.1 with real language search (REVIEW ONLY)

on:
  push:
    branches:
      - feature/complete-all-52-jars-2026-10-18
    paths:
      - '.github/workflows/review-forge-1.20.1.yml'
      - 'ci/review/forge1201/**'
      - 'features/language-search/forge_1_20_1/**'
      - 'features/language-search/common/**'
      - 'translations/staged-published-2026-10-11/1.20.1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate latest JEI 1.20.1 sources before compilation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('translations/staged-published-2026-10-11/1.20.1')
          audit=json.loads((root/'semantic-diff.json').read_text(encoding='utf-8'))
          english=json.loads((root/'source/en_us.json').read_text(encoding='utf-8'))
          assert audit['new_jei']=='15.62.0.219'
          assert len(english)==566
          resources={}
          for kind in ('full','supplements'):
              for p in sorted((root/kind/'assets/jei/lang').glob('*.json')):
                  assert p.stem not in resources
                  data=json.loads(p.read_text(encoding='utf-8'))
                  assert set(data)<=set(english)
                  assert all(isinstance(v,str) for v in data.values())
                  if kind=='full': assert len(data)==len(english)
                  resources[p.stem]=kind
          assert len(resources)==88, len(resources)
          assert set(resources)==set(audit['locale_counts'])
          print('AUDIT OK: JEI 15.62.0.219, 566 keys, 88 locale files')
          PY
      - name: Compile real Forge client and package event-hooked JAR
        run: gradle --no-daemon --console=plain -p ci/review/forge1201 build
      - name: Check mod metadata, search class, translated resources and ZIP CRC
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find ci/review/forge1201/build/libs -maxdepth 1 -name '*.jar' -type f | head -n 1)
          test -s "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -F 'META-INF/mods.toml'
          unzip -l "$JAR" | grep -F 'LanguageSearchForge1201.class'
          unzip -l "$JAR" | grep -F 'LanguageSearchMatcher.class'
          unzip -l "$JAR" | grep -F 'assets/jei/lang/fr_fr.json'
          sha256sum "$JAR"
      - name: Upload test JAR, not a public release
        uses: actions/upload-artifact@v4
        with:
          name: mc1.20.1-forge-search-translations-NEEDS-GAME-TESTS
          path: ci/review/forge1201/build/libs/*.jar
          retention-days: 30
          if-no-files-found: error

name: Finalize G46 Minecraft 1.21.10

on:
  workflow_dispatch:
  push:
    branches: ['work/g46-mc1.21.10-audit']
    paths:
      - 'scripts/finalize_g46_metadata.py'
      - '.github/workflows/finalize-g46.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Revalidate G46 translation resources
        run: |
          python scripts/validate_1_21_10_delta.py
          python scripts/validate_1_21_10_complete.py
      - name: Register G46 packaging target
        run: python scripts/finalize_g46_metadata.py
      - name: Synchronize upstream registries through G46
        run: python scripts/sync_upstream_registries.py --date 2026-09-15
      - name: Build G46 NeoForge candidate
        run: |
          rm -rf build/g46-candidate
          python scripts/build_completed_jar_neoforge.py --minecraft 1.21.10 --version 1.0.0 --output-dir build/g46-candidate
      - name: Inspect G46 candidate
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/g46-candidate -maxdepth 1 -type f -name '*.jar')
          test -n "$JAR"
          test "$(printf '%s\n' "$JAR" | wc -l)" -eq 1
          test "$(basename "$JAR")" = 'jei-translation-expansion-1.0.0-mc1.21.10-neoforge.jar'
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -q 'META-INF/neoforge.mods.toml'
          if unzip -l "$JAR" | grep -q 'META-INF/mods.toml'; then
            echo 'Unexpected legacy Forge mods.toml in NeoForge candidate'
            exit 1
          fi
          COUNT=$(zipinfo -1 "$JAR" | grep -E '^assets/jei/lang/[^/]+\.json$' | wc -l)
          test "$COUNT" -eq 89
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q '1.21.10'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q '26.2.0'
          sha256sum "$JAR" | tee build/g46-candidate/SHA256SUMS.txt
          echo "Language resources: $COUNT"
      - name: Upload validated G46 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: g46-mc1.21.10-static-candidate
          path: |
            build/g46-candidate/*.jar
            build/g46-candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Commit G46 completion metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/completed-versions.json upstream/versions.json upstream/generations.json
          if git diff --cached --quiet; then
            echo 'G46 completion metadata already matches.'
            exit 0
          fi
          git commit -m 'Register G46 Minecraft 1.21.10 packaging metadata'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

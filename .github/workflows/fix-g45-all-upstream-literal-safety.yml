name: Generalize G45 upstream literal safety overrides

on:
  workflow_dispatch:
  push:
    branches: ['work/g45-mc1.21.9-audit']
    paths:
      - '.github/workflows/fix-g45-all-upstream-literal-safety.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generalize literal-safety override policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one patch anchor, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/reconstruct_1_21_9.py',
              'MALFORMED_FULL_OVERRIDES = {"uk_ua"}\nUPSTREAM_LITERAL_SAFETY_OVERRIDES = {\n    "ar_sa": {"jei.config.client.search.description"},\n}\n',
              'MALFORMED_FULL_OVERRIDES = {"uk_ua"}\n',
          )
          replace_once(
              'scripts/reconstruct_1_21_9.py',
              '        override_keys = set(UPSTREAM_LITERAL_SAFETY_OVERRIDES.get(locale, set()))\n',
              '        override_keys = set(scope.get("upstream_literal_safety_overrides", {}).get(locale, []))\n',
          )
          replace_once(
              'scripts/validate_1_21_9_complete.py',
              '            override_keys = set(g45.UPSTREAM_LITERAL_SAFETY_OVERRIDES.get(locale, set()))\n',
              '            override_keys = set(scope.get("upstream_literal_safety_overrides", {}).get(locale, []))\n',
          )

          replace_once(
              'scripts/bootstrap_1_21_9.py',
              'import audit_1_21_9 as audit\n',
              'import audit_1_21_9 as audit\nimport reconstruct_1_21_8 as g44\n',
          )
          replace_once(
              'scripts/bootstrap_1_21_9.py',
              'EXPECTED_REMOVED = audit.OLD_CATEGORY_KEYS\nUPSTREAM_LITERAL_SAFETY_OVERRIDES = {"ar_sa": ["jei.config.client.search.description"]}\nUPSTREAM_LITERAL_SAFETY_OVERRIDE_REASON = "Pinned ar_sa translation omits the fixed technical literal JEI; emit exact target English for this key."\n',
              'EXPECTED_REMOVED = audit.OLD_CATEGORY_KEYS\n',
          )
          replace_once(
              'scripts/bootstrap_1_21_9.py',
              '''    fallback_locales = list(previous_scope["documented_full_english_fallback_locales"])\n    if len(fallback_locales) != 30 or "uk_ua" in fallback_locales:\n        raise ValueError("G45 documented fallback ownership changed")\n\n    TARGET_SOURCE.parent.mkdir(parents=True, exist_ok=True)\n''',
              '''    fallback_locales = list(previous_scope["documented_full_english_fallback_locales"])\n    if len(fallback_locales) != 30 or "uk_ua" in fallback_locales:\n        raise ValueError("G45 documented fallback ownership changed")\n\n    upstream_literal_safety_overrides: dict[str, list[str]] = {}\n    for locale in incomplete:\n        values, repaired = audit.parse_locale(locale)\n        if repaired:\n            raise ValueError(f"{locale}: malformed locale cannot be a G45 supplement")\n        unsafe = [\n            key for key in sorted(normal & set(values))\n            if not g44.preserves_runtime_literals(target[key], values[key])\n        ]\n        if unsafe:\n            upstream_literal_safety_overrides[locale] = unsafe\n    if sum(len(keys) for keys in upstream_literal_safety_overrides.values()) != 89:\n        raise ValueError(f"G45 upstream literal-safety override inventory changed: {upstream_literal_safety_overrides}")\n    upstream_literal_safety_override_reason = (\n        "Pinned upstream translations that fail exact placeholder/technical-literal preservation are "\n        "overridden only for those specific keys with a safe same-key reconstruction or exact target English."\n    )\n\n    TARGET_SOURCE.parent.mkdir(parents=True, exist_ok=True)\n''',
          )
          p = Path('scripts/bootstrap_1_21_9.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('UPSTREAM_LITERAL_SAFETY_OVERRIDES', 'upstream_literal_safety_overrides')
          text = text.replace('UPSTREAM_LITERAL_SAFETY_OVERRIDE_REASON', 'upstream_literal_safety_override_reason')
          p.write_text(text, encoding='utf-8')

          replace_once(
              'scripts/validate_1_21_9_delta.py',
              '''    expected_safety_overrides = {"ar_sa": ["jei.config.client.search.description"]}\n    if scope.get("upstream_literal_safety_overrides") != expected_safety_overrides:\n        raise ValueError("G45 upstream literal safety override set changed")\n''',
              '''    expected_safety_overrides = {}\n    for locale in scope["selected_upstream_incomplete_locales"]:\n        upstream = g45.fetch_g45_upstream(locale)\n        unsafe = [\n            key for key in sorted(normal & set(upstream))\n            if not g45.preserves_runtime_literals(target[key], upstream[key])\n        ]\n        if unsafe:\n            expected_safety_overrides[locale] = unsafe\n    if sum(len(keys) for keys in expected_safety_overrides.values()) != 89:\n        raise ValueError("G45 upstream literal safety override count changed")\n    if scope.get("upstream_literal_safety_overrides") != expected_safety_overrides:\n        raise ValueError("G45 upstream literal safety override set changed")\n''',
          )
          replace_once(
              'scripts/validate_1_21_9_delta.py',
              '    if policy.get("upstream_literal_safety_overrides") != {"ar_sa": ["jei.config.client.search.description"]}:\n',
              '    if policy.get("upstream_literal_safety_overrides") != expected_safety_overrides:\n',
          )
          PY
          git diff --check

      - name: Validate fixed G45 end to end
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/audit_1_21_9.py
          python scripts/bootstrap_1_21_9.py
          python scripts/validate_1_21_9_delta.py
          python scripts/validate_1_21_9_complete.py

      - name: Persist fixed G45 manifests and remove temporary helpers
        shell: bash
        run: |
          git rm -f \
            .github/workflows/fix-g45-upstream-literal-safety.yml \
            .github/workflows/diagnose-g45-upstream-literals.yml \
            .github/workflows/fix-g45-all-upstream-literal-safety.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/bootstrap_1_21_9.py \
            scripts/reconstruct_1_21_9.py \
            scripts/validate_1_21_9_delta.py \
            scripts/validate_1_21_9_complete.py \
            upstream/sources/1.21.9/en_us.json \
            upstream/diffs/1.21.8-to-1.21.9.json \
            upstream/minecraft-1.21.9-language-audit.json \
            upstream/minecraft-1.21.9-language-scope.json \
            translations/g45-mc1.21.9/policy.json
          git commit -m 'Freeze G45 with upstream technical-literal safety overrides'
          git pull --rebase origin work/g45-mc1.21.9-audit
          git push origin HEAD:work/g45-mc1.21.9-audit

name: Finalize G50 Minecraft 26.1.2

on:
  workflow_dispatch:
  push:
    branches: ['work/g50-mc26.1.2-audit']
    paths:
      - '.github/workflows/finalize-g50.yml'
      - 'scripts/finalize_26_1_2.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Revalidate frozen G50 resources
        run: |
          python scripts/validate_26_1_2_delta.py
          python scripts/validate_26_1_2_complete.py

      - name: Register G50 packaging and registries
        run: python scripts/finalize_26_1_2.py --phase register

      - name: Build G50 NeoForge candidate
        run: python scripts/build_completed_jar_neoforge.py --minecraft 26.1.2 --version 1.0.0 --output-dir build/g50-candidate

      - name: Inspect G50 candidate and update status
        shell: bash
        run: |
          set -euo pipefail
          JAR='build/g50-candidate/jei-translation-expansion-1.0.0-mc26.1.2-neoforge.jar'
          test -f "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -F 'META-INF/neoforge.mods.toml'
          if unzip -l "$JAR" | grep -F 'META-INF/mods.toml'; then
            echo 'Forge mods.toml leaked into G50 NeoForge candidate'
            exit 1
          fi
          COUNT=$(unzip -Z1 "$JAR" | grep -c '^assets/jei/lang/.*\.json$')
          test "$COUNT" -eq 89
          SHA=$(sha256sum "$JAR" | awk '{print $1}')
          echo "G50 candidate SHA-256: $SHA"
          python scripts/finalize_26_1_2.py --phase status --sha256 "$SHA"

      - name: Upload validated G50 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-mc26.1.2-validated
          path: build/g50-candidate/jei-translation-expansion-1.0.0-mc26.1.2-neoforge.jar
          if-no-files-found: error
          retention-days: 30

      - name: Commit G50 completion metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/completed-versions.json upstream/versions.json upstream/generations.json PROJECT_STATUS.md
          if git diff --cached --quiet; then
            echo 'G50 completion metadata already current.'
            exit 0
          fi
          git commit -m 'Complete G50 Minecraft 26.1.2 metadata and packaging validation'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Validate G34 Minecraft 1.20.1

on:
  workflow_dispatch:
  push:
    branches: ['work/g34-mc1.20.1']
    paths:
      - 'scripts/audit_1_20_1.py'
      - 'scripts/reconstruct_1_20_1.py'
      - 'scripts/validate_1_20_1_delta.py'
      - 'scripts/validate_1_20_1_complete.py'
      - 'upstream/sources/1.20.1/en_us.json'
      - 'upstream/diffs/1.20-to-1.20.1.json'
      - 'upstream/minecraft-1.20.1-language-scope.json'
      - 'upstream/minecraft-1.20.1-language-audit.json'
      - 'translations/g34-mc1.20.1/policy.json'
      - '.github/workflows/audit-g34.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.20.1 / JEI 15.2.0 endpoint
        run: python scripts/audit_1_20_1.py
      - name: Validate Minecraft 1.20.1 source scope and upstream ownership
        run: python scripts/validate_1_20_1_delta.py
      - name: Reconstruct and verify Minecraft 1.20.1 resources
        run: python scripts/reconstruct_1_20_1.py --check
      - name: Validate Minecraft 1.20.1 complete resources
        run: python scripts/validate_1_20_1_complete.py

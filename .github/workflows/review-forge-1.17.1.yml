name: Build Forge Minecraft 1.17.1 Java 16 search candidate (REVIEW ONLY)
on:
  push:
    branches: [feature/complete-all-52-jars-2026-10-18]
    paths: ['.github/workflows/review-forge-1.17.1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Build real Forge 1.17.1 JAR with search and 8.3.1.1002 JEI locales
        run: >
          gradle --no-daemon --console=plain -p ci/review/forge-1.16 build
          -Pmc_version=1.17.1
          -Pforge_version=37.1.1
          -Pjei_version=8.3.1.1002
          -Psearch_source=drafts/mc1_17_1
          -Pjava_target=16
      - name: Inspect artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find ci/review/forge-1.16/build/libs -name '*.jar' | head -n1)
          test -s "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep 'LanguageSearch.*class'
          unzip -l "$JAR" | grep 'assets/jei/lang/'
          sha256sum "$JAR"
      - name: Save only to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.17.1-language-search-Java16-preview
          path: ci/review/forge-1.16/build/libs/*.jar
          retention-days: 30
          if-no-files-found: error

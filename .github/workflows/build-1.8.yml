name: Build Minecraft 1.8 prototype

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prototype project version
        required: false
        default: 0.1.0-ci
  push:
    branches: [main]
    paths:
      - 'packaging/1.8/**'
      - 'scripts/build_1_8.py'
      - 'translations/g1-mc1.8/**'
      - 'upstream/sources/1.8/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/build-1.8.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Build prototype JAR
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-0.1.0-ci}"
          python scripts/build_1_8.py --version "$VERSION"

      - name: Inspect JAR and Forge entrypoint bytecode
        run: |
          JAR=$(find build/releases/1.8 -name '*.jar' -type f | head -n 1)
          test -n "$JAR"
          unzip -l "$JAR"
          test "$(unzip -Z1 "$JAR" | grep '^assets/jei/lang/.*\.lang$' | wc -l)" -eq 54
          ! unzip -Z1 "$JAR" | grep -q '^net/minecraftforge/fml/common/Mod.class$'
          javap -verbose -classpath "$JAR" io.github.romaintv20.jeitranslationexpansion.JeiTranslationExpansion | tee build/javap-1.8.txt
          grep -Fq 'major version: 51' build/javap-1.8.txt
          grep -Fq 'RuntimeVisibleAnnotations' build/javap-1.8.txt
          grep -Fq 'Lnet/minecraftforge/fml/common/Mod;' build/javap-1.8.txt
          grep -Fq 'jei_translation_expansion' build/javap-1.8.txt
          grep -Fq 'clientSideOnly' build/javap-1.8.txt
          grep -Fq 'acceptedMinecraftVersions' build/javap-1.8.txt
          grep -Fq '[1.8]' build/javap-1.8.txt
          grep -Fq 'required-after:Forge@[11.14.0.1269,);required-after:JEI@[2.15.0]' build/javap-1.8.txt
          sha256sum "$JAR"

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-mc1.8-prototype
          path: build/releases/1.8/*.jar
          if-no-files-found: error
          retention-days: 14

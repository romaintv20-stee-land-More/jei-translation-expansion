name: Audit G43 Minecraft 1.21.7

on:
  workflow_dispatch:
  push:
    branches: ['work/g43-mc1.21.7-audit']
    paths:
      - 'scripts/audit_1_21_7.py'
      - '.github/workflows/audit-g43.yml'
      - 'upstream/sources/1.21.6/en_us.json'
      - 'upstream/minecraft-1.21.6-language-scope.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.21.7 endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_1_21_7.py

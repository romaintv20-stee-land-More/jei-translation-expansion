name: Audit G31 Minecraft 1.19.3

on:
  workflow_dispatch:
  push:
    branches: ['work/g31-mc1.19.3']
    paths:
      - 'scripts/audit_1_19_3.py'
      - '.github/workflows/audit-g31.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit final Minecraft 1.19.3 / JEI 12.3.0 endpoint
        run: python scripts/audit_1_19_3.py

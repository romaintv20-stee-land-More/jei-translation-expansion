name: Build Minecraft 1.8.9 prototype

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prototype project version
        required: false
        default: 0.1.0-ci
  push:
    branches: [main]
    paths:
      - 'packaging/1.8.9/**'
      - 'scripts/build_1_8_9.py'
      - 'scripts/reconstruct_1_8_9.py'
      - 'scripts/validate_1_8_9_delta.py'
      - 'scripts/validate_1_8_9_upstream_supplements.py'
      - 'translations/g1-mc1.8/**'
      - 'translations/g2-mc1.8.9/**'
      - 'upstream/sources/1.8/**'
      - 'upstream/sources/1.8.9/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/build-1.8.9.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Validate 1.8.9 delta
        run: python scripts/validate_1_8_9_delta.py

      - name: Validate upstream locale supplements
        run: python scripts/validate_1_8_9_upstream_supplements.py

      - name: Verify complete locale reconstruction
        run: python scripts/reconstruct_1_8_9.py --check

      - name: Build prototype JAR
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-0.1.0-ci}"
          python scripts/build_1_8_9.py --version "$VERSION"

      - name: Inspect JAR and Forge entrypoint bytecode
        run: |
          JAR=$(find build/releases/1.8.9 -name '*.jar' -type f | head -n 1)
          test -n "$JAR"
          unzip -l "$JAR"
          test "$(unzip -Z1 "$JAR" | grep '^assets/jei/lang/.*\.lang$' | wc -l)" -eq 59
          ! unzip -Z1 "$JAR" | grep -q '^net/minecraftforge/fml/common/Mod.class$'
          javap -verbose -classpath "$JAR" io.github.romaintv20.jeitranslationexpansion.JeiTranslationExpansion > build/javap-1.8.9.txt
          grep -q 'major version: 51' build/javap-1.8.9.txt
          grep -q 'RuntimeVisibleAnnotations' build/javap-1.8.9.txt
          grep -q 'jei_translation_expansion' build/javap-1.8.9.txt
          grep -q 'clientSideOnly=true' build/javap-1.8.9.txt
          grep -q '\[1.8.9\]' build/javap-1.8.9.txt
          grep -q 'required-after:JEI@\[2.28.18\]' build/javap-1.8.9.txt
          sha256sum "$JAR"

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-mc1.8.9-prototype
          path: build/releases/1.8.9/*.jar
          if-no-files-found: error
          retention-days: 14

name: Package G41 Minecraft 1.21.5 candidate

on:
  workflow_dispatch:
  push:
    branches: ['work/g41-mc1.21.5-audit']
    paths:
      - '.github/workflows/package-g41.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Register G41 packaging target in worktree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packaging/completed-versions.json')
          text = path.read_text(encoding='utf-8')
          old_note = '"note": "G1-G40 are translation/reconstruction complete. These builds are static-validated release candidates until their required runtime gates are complete.",'
          new_note = '"note": "G1-G41 are translation/reconstruction complete. These builds are static-validated release candidates until their required runtime gates are complete.",'
          g40 = '    {"generation":"G40","minecraft":"1.21.4","jei":"20.0.0","era":"modern","loader":"neoforge","neoforge":"21.4.136","loader_version_range":"[4,)","neoforge_version_range":"[21.4.121,)","jei_modid":"jei","java_target":21,"format":"json","full":64,"supplements":25,"keys":288,"reconstruct_script":"scripts/reconstruct_1_21_4.py"}'
          g41 = '    {"generation":"G41","minecraft":"1.21.5","jei":"21.4.0","era":"modern","loader":"neoforge","neoforge":"21.5.75","loader_version_range":"[4,)","neoforge_version_range":"[21.5.74,)","jei_modid":"jei","java_target":21,"format":"json","full":65,"supplements":24,"keys":290,"reconstruct_script":"scripts/reconstruct_1_21_5.py"}'
          if '"generation":"G41"' not in text:
              if old_note not in text:
                  raise SystemExit('Expected G1-G40 packaging note not found')
              if g40 + '\n  ]' not in text:
                  raise SystemExit('Expected final G40 packaging entry not found')
              text = text.replace(old_note, new_note, 1)
              text = text.replace(g40 + '\n  ]', g40 + ',\n' + g41 + '\n  ]', 1)
              path.write_text(text, encoding='utf-8')
          else:
              import json
              data = json.loads(text)
              latest = data['versions'][-1]
              assert latest['generation'] == 'G41'
              assert latest['minecraft'] == '1.21.5'
              assert latest['jei'] == '21.4.0'
              assert latest['full'] == 65 and latest['supplements'] == 24 and latest['keys'] == 290
          PY
      - name: Build Minecraft 1.21.5 NeoForge candidate
        run: python scripts/build_completed_jar_neoforge.py --minecraft 1.21.5 --version 1.0.0
      - name: Inspect candidate
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/completed-jars/1.21.5 -maxdepth 1 -name '*.jar' -type f)
          test -n "$JAR"
          test "$(printf '%s\n' "$JAR" | wc -l)" -eq 1
          case "$JAR" in *-mc1.21.5-neoforge.jar) ;; *) echo 'Unexpected candidate filename'; exit 1;; esac
          unzip -t "$JAR"
          unzip -l "$JAR" | grep -F 'META-INF/neoforge.mods.toml'
          if unzip -l "$JAR" | grep -F 'META-INF/mods.toml'; then
            echo 'Forge mods.toml leaked into NeoForge candidate'
            exit 1
          fi
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'versionRange="[1.21.5]"'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'versionRange="[21.4.0]"'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'versionRange="[21.5.74,)"'
          COUNT=$(unzip -l "$JAR" | awk '$4 ~ /^assets\/jei\/lang\/.*\.json$/ {count++} END {print count+0}')
          test "$COUNT" -eq 89
          sha256sum "$JAR"
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-mc1.21.5-neoforge
          path: build/completed-jars/1.21.5/*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Persist G41 packaging target to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/completed-versions.json
          if git diff --cached --quiet; then
            echo 'G41 packaging target already persisted.'
            exit 0
          fi
          git commit -m 'Register G41 Minecraft 1.21.5 packaging target'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

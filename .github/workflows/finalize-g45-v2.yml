name: Finalize G45 Minecraft 1.21.9 v2

on:
  workflow_dispatch:
  push:
    branches: ['work/g45-mc1.21.9-audit']
    paths:
      - '.github/workflows/finalize-g45-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Revalidate G45 resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/audit_1_21_9.py
          python scripts/bootstrap_1_21_9.py
          python scripts/validate_1_21_9_delta.py
          python scripts/validate_1_21_9_complete.py
      - name: Register and synchronize G45 metadata
        run: |
          python scripts/finalize_g45_metadata.py register
          python scripts/sync_upstream_registries.py --date 2026-09-15
      - name: Build G45 NeoForge candidate
        run: python scripts/build_completed_jar_neoforge.py --minecraft 1.21.9 --version 1.0.0
      - name: Inspect candidate and update status
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/completed-jars/1.21.9 -maxdepth 1 -name 'jei-translation-expansion-1.0.0-mc1.21.9-neoforge.jar' -type f)
          test -n "$JAR"
          unzip -t "$JAR"
          test "$(unzip -l "$JAR" | grep -c 'assets/jei/lang/.*\.json')" -eq 89
          unzip -l "$JAR" | grep -F 'META-INF/neoforge.mods.toml'
          if unzip -l "$JAR" | grep -F 'META-INF/mods.toml'; then exit 1; fi
          SHA=$(sha256sum "$JAR" | awk '{print $1}')
          echo "$SHA  $(basename "$JAR")" | tee g45-candidate-sha256.txt
          python scripts/finalize_g45_metadata.py status --sha256 "$SHA"
      - name: Upload validated G45 candidate
        uses: actions/upload-artifact@v4
        with:
          name: jei-translation-expansion-1.0.0-mc1.21.9-validated
          path: |
            build/completed-jars/1.21.9/*.jar
            g45-candidate-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Commit G45 completion metadata
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/finalize-g45.yml .github/workflows/finalize-g45-v2.yml scripts/finalize_g45_metadata.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/completed-versions.json upstream/versions.json upstream/generations.json PROJECT_STATUS.md
          git add upstream/sources/1.21.9/en_us.json upstream/diffs/1.21.8-to-1.21.9.json
          git add upstream/minecraft-1.21.9-language-audit.json upstream/minecraft-1.21.9-language-scope.json translations/g45-mc1.21.9/policy.json
          git commit -m 'Complete G45 Minecraft 1.21.9 metadata and packaging'
          git pull --rebase origin work/g45-mc1.21.9-audit
          git push origin HEAD:work/g45-mc1.21.9-audit
